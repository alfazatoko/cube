<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <!-- Background -->
  <rect width="800" height="200" fill="#f8fafc" rx="16"/>
  
  <!-- Icon 1: Penyesuaian (Blue) -->
  <g transform="translate(50, 25)">
    <rect width="150" height="150" fill="white" stroke="#0ea5e9" stroke-width="3" rx="20"/>
    <!-- Sliders icon -->
    <g transform="translate(75, 60)" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round">
      <line x1="-30" y1="-15" x2="30" y2="-15"/>
      <line x1="-30" y1="0" x2="30" y2="0"/>
      <line x1="-30" y1="15" x2="30" y2="15"/>
      <circle cx="-10" cy="-15" r="5" fill="#0ea5e9"/>
      <circle cx="15" cy="0" r="5" fill="#0ea5e9"/>
      <circle cx="-5" cy="15" r="5" fill="#0ea5e9"/>
    </g>
    <text x="75" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">PENYESUAIAN</text>
  </g>
  
  <!-- Icon 2: Non Tunai (Green) -->
  <g transform="translate(225, 25)">
    <rect width="150" height="150" fill="white" stroke="#22c55e" stroke-width="3" rx="20"/>
    <!-- Credit card and phone icon -->
    <g transform="translate(75, 60)">
      <rect x="-25" y="-20" width="40" height="25" rx="4" fill="none" stroke="#22c55e" stroke-width="3"/>
      <line x1="-25" y1="-10" x2="15" y2="-10" stroke="#22c55e" stroke-width="2"/>
      <rect x="-5" y="-5" width="35" height="45" rx="6" fill="none" stroke="#22c55e" stroke-width="3"/>
      <circle cx="12" cy="28" r="6" fill="none" stroke="#22c55e" stroke-width="2"/>
      <path d="M9 28 L12 31 L17 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="75" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">NON TUNAI</text>
  </g>
  
  <!-- Icon 3: Catatan (Orange) -->
  <g transform="translate(400, 25)">
    <rect width="150" height="150" fill="white" stroke="#f97316" stroke-width="3" rx="20"/>
    <!-- Notebook icon -->
    <g transform="translate(75, 60)">
      <rect x="-20" y="-25" width="35" height="50" rx="3" fill="none" stroke="#f97316" stroke-width="3"/>
      <line x1="-12" y1="-25" x2="-12" y2="25" stroke="#f97316" stroke-width="2"/>
      <line x1="-5" y1="-10" x2="8" y2="-10" stroke="#f97316" stroke-width="2"/>
      <line x1="-5" y1="0" x2="8" y2="0" stroke="#f97316" stroke-width="2"/>
      <line x1="-5" y1="10" x2="8" y2="10" stroke="#f97316" stroke-width="2"/>
      <path d="M5 -30 L15 -20 L15 30 L5 40" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="75" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">CATATAN</text>
  </g>
  
  <!-- Icon 4: Lain Nya (Purple) -->
  <g transform="translate(575, 25)">
    <rect width="150" height="150" fill="white" stroke="#a855f7" stroke-width="3" rx="20"/>
    <!-- List with plus icon -->
    <g transform="translate(75, 60)">
      <circle cx="-15" cy="-15" r="4" fill="#a855f7"/>
      <line x1="-5" y1="-15" x2="20" y2="-15" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-15" cy="0" r="4" fill="#a855f7"/>
      <line x1="-5" y1="0" x2="15" y2="0" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-15" cy="15" r="4" fill="#a855f7"/>
      <line x1="-5" y1="15" x2="10" y2="15" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
      <circle cx="20" cy="15" r="8" fill="none" stroke="#a855f7" stroke-width="2"/>
      <line x1="20" y1="11" x2="20" y2="19" stroke="#a855f7" stroke-width="2"/>
      <line x1="16" y1="15" x2="24" y2="15" stroke="#a855f7" stroke-width="2"/>
    </g>
    <text x="75" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#581c87">LAIN NYA</text>
  </g>
</svg>
