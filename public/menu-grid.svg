<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120">
  <!-- Background -->
  <rect width="1000" height="120" fill="#f8fafc" rx="16"/>
  
  <!-- Icon 1: Penyesuaian (Blue) -->
  <g transform="translate(25, 10)">
    <rect width="170" height="100" fill="white" stroke="#0ea5e9" stroke-width="3" rx="16"/>
    <!-- Sliders icon -->
    <g transform="translate(85, 45)" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round">
      <line x1="-25" y1="-12" x2="25" y2="-12"/>
      <line x1="-25" y1="0" x2="25" y2="0"/>
      <line x1="-25" y1="12" x2="25" y2="12"/>
      <circle cx="-8" cy="-12" r="4" fill="#0ea5e9"/>
      <circle cx="12" cy="0" r="4" fill="#0ea5e9"/>
      <circle cx="-3" cy="12" r="4" fill="#0ea5e9"/>
    </g>
    <text x="85" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">PENYESUAIAN</text>
  </g>
  
  <!-- Icon 2: Non Tunai (Green) -->
  <g transform="translate(215, 10)">
    <rect width="170" height="100" fill="white" stroke="#22c55e" stroke-width="3" rx="16"/>
    <!-- Card with signal icon -->
    <g transform="translate(85, 45)">
      <rect x="-18" y="-15" width="30" height="20" rx="3" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <line x1="-18" y1="-8" x2="12" y2="-8" stroke="#22c55e" stroke-width="1.5"/>
      <path d="M5 -20 Q20 -20 20 -5 L20 10 Q20 20 5 20" fill="none" stroke="#22c55e" stroke-width="2"/>
      <path d="M10 -8 L15 -3 L10 2" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 -5 L22 -12" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 0 Q18 -5 22 0" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
      <path d="M15 5 Q20 0 24 5" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="85" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">NON TUNAI</text>
  </g>
  
  <!-- Icon 3: Catatan (Orange) -->
  <g transform="translate(405, 10)">
    <rect width="170" height="100" fill="white" stroke="#f97316" stroke-width="3" rx="16"/>
    <!-- Notebook icon -->
    <g transform="translate(85, 45)">
      <rect x="-15" y="-20" width="28" height="40" rx="3" fill="none" stroke="#f97316" stroke-width="2.5"/>
      <line x1="-8" y1="-20" x2="-8" y2="20" stroke="#f97316" stroke-width="2"/>
      <line x1="-3" y1="-8" x2="10" y2="-8" stroke="#f97316" stroke-width="1.5"/>
      <line x1="-3" y1="0" x2="10" y2="0" stroke="#f97316" stroke-width="1.5"/>
      <line x1="-3" y1="8" x2="10" y2="8" stroke="#f97316" stroke-width="1.5"/>
      <path d="M8 -25 L18 -18 L18 22 L8 30" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="85" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">CATATAN</text>
  </g>
  
  <!-- Icon 4: Nota (Red) -->
  <g transform="translate(595, 10)">
    <rect width="170" height="100" fill="white" stroke="#dc2626" stroke-width="3" rx="16"/>
    <!-- Nota/Receipt with dollar icon -->
    <g transform="translate(85, 45)">
      <rect x="-18" y="-22" width="32" height="42" rx="2" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="-18" y1="-15" x2="14" y2="-15" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="-18" y1="-8" x2="14" y2="-8" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="-12" y1="2" x2="8" y2="2" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="-12" y1="8" x2="8" y2="8" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="-5" y="-8" width="18" height="22" rx="2" fill="none" stroke="#dc2626" stroke-width="2"/>
      <text x="4" y="6" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">$</text>
    </g>
    <text x="85" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">NOTA</text>
  </g>
  
  <!-- Icon 5: Lain Nya (Purple) -->
  <g transform="translate(785, 10)">
    <rect width="170" height="100" fill="white" stroke="#a855f7" stroke-width="3" rx="16"/>
    <!-- List with plus icon -->
    <g transform="translate(85, 45)">
      <circle cx="-18" cy="-12" r="3" fill="#a855f7"/>
      <line x1="-10" y1="-12" x2="15" y2="-12" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-18" cy="0" r="3" fill="#a855f7"/>
      <line x1="-10" y1="0" x2="12" y2="0" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-18" cy="12" r="3" fill="#a855f7"/>
      <line x1="-10" y1="12" x2="8" y2="12" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="15" cy="12" r="6" fill="none" stroke="#a855f7" stroke-width="2"/>
      <line x1="15" y1="8" x2="15" y2="16" stroke="#a855f7" stroke-width="2"/>
      <line x1="11" y1="12" x2="19" y2="12" stroke="#a855f7" stroke-width="2"/>
    </g>
    <text x="85" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#581c87">LAINNYA</text>
  </g>
</svg>
